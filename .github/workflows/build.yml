name: Build Fisch Macro APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Locate the Android project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR="."

          ZIP_CANDIDATES=(
            "FischMacro.zip"
            "FischMacro(2)-full-loop-tuning.zip"
            "FischMacro*.zip"
          )

          for zip_name in "${ZIP_CANDIDATES[@]}"; do
            if compgen -G "$zip_name" > /dev/null; then
              rm -rf build-root
              mkdir -p build-root
              unzip -q "$zip_name" -d build-root

              if [ ! -f build-root/settings.gradle ] && [ ! -f build-root/settings.gradle.kts ] && [ ! -f build-root/build.gradle ] && [ ! -f build-root/build.gradle.kts ]; then
                shopt -s dotglob nullglob
                matches=(build-root/*)
                if [ "${#matches[@]}" -eq 1 ] && [ -d "${matches[0]}" ]; then
                  mv "${matches[0]}"/* build-root/ 2>/dev/null || true
                  mv "${matches[0]}"/.* build-root/ 2>/dev/null || true
                  rmdir "${matches[0]}" 2>/dev/null || true
                fi
              fi

              if [ -f build-root/settings.gradle ] || [ -f build-root/settings.gradle.kts ] || [ -f build-root/build.gradle ] || [ -f build-root/build.gradle.kts ]; then
                PROJECT_DIR="build-root"
                break
              fi
            fi
          done

          if [ "$PROJECT_DIR" = "." ] && [ ! -f settings.gradle ] && [ ! -f settings.gradle.kts ] && [ ! -f build.gradle ] && [ ! -f build.gradle.kts ]; then
            echo "No Gradle project found in repo root or zip archive."
            find . -maxdepth 3 \( -name settings.gradle -o -name settings.gradle.kts -o -name build.gradle -o -name build.gradle.kts \) | head
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FischMacro-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish APK as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Fisch Macro build ${{ github.run_number }}
          files: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
